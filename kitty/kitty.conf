font_family      family="SF Mono" style="Regular"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
text_composition_strategy 1.0 0
modify_font cell_height 118%

initial_window_width  120c
initial_window_height 45c
remember_window_size  yes
window_padding_width  12 14 4 14

macos_titlebar_color    background
macos_option_as_alt     yes
macos_quit_when_last_window_closed yes
copy_on_select          clipboard
confirm_os_window_close 2
enable_audio_bell       no

cursor_shape   block
cursor_trail   0

tab_bar_edge          bottom
tab_bar_style         custom
tab_bar_min_tabs      1
tab_bar_margin_height 14 4
tab_bar_margin_width  14
tab_title_template    "{index} {tab.active_wd.rsplit('/', 1)[-1] or title}"
active_tab_font_style bold
inactive_tab_font_style normal

map cmd+t new_tab_with_cwd
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+ctrl+left resize_window narrower 4
map cmd+ctrl+right resize_window wider 4
map cmd+ctrl+up resize_window taller 4
map cmd+ctrl+down resize_window shorter 4
map shift+cmd+s reset_window_sizes
enabled_layouts splits,stack

foreground            #d8dee9
background            #2e3440
selection_foreground  #eceff4
selection_background  #4c566a
url_color             #88c0d0
cursor                #d8dee9
cursor_text_color     #2e3440

color0  #3b4252
color8  #4c566a
color1  #bf616a
color9  #bf616a
color2  #a3be8c
color10 #a3be8c
color3  #ebcb8b
color11 #ebcb8b
color4  #81a1c1
color12 #81a1c1
color5  #b48ead
color13 #b48ead
color6  #88c0d0
color14 #8fbcbb
color7  #e5e9f0
color15 #eceff4

tab_bar_background      #2e3440
tab_bar_margin_color    #2e3440
active_tab_foreground   #2e3440
active_tab_background   #88c0d0
inactive_tab_foreground #d8dee9
inactive_tab_background #3b4252

active_border_color   #88c0d0
inactive_border_color #3b4252
bell_border_color     #ebcb8b
mark1_foreground #2e3440
mark1_background #bf616a
